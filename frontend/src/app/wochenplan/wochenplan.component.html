<table>
  <thead>
  <tr>
    <th>Saal</th>
    <th *ngFor="let day of wochentage">{{ day }}</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let saal of saele">
    <td>{{ saal }}</td>
    <td *ngFor="let day of wochentage">
      <ng-container *ngFor="let vorstellung of vorstellungen">
        <ng-container *ngIf="vorstellung.saal.name === saal && isSameDay(vorstellung.anfangszeit, day)">
          <div class="movie-info">
            <strong>{{ vorstellung.film.titel }}</strong>
            <p>{{ vorstellung.anfangszeit | date:'HH:mm' }} - {{ vorstellung.endzeit | date:'HH:mm' }}</p>
            <p>{{ vorstellung.preis / 100 | currency:'EUR':'symbol':'1.2-2' }}</p>
          </div>
        </ng-container>
      </ng-container>
    </td>
  </tr>
  </tbody>
</table>
