<h2>Kinokarte</h2>
<div class="kinokarte">
  <div>
    {{ vorstellung?.anfangszeit | date : 'dd.MM.YYYY HH:mm' }} Uhr
    <br>
    {{ vorstellung?.saal }}
    <br>
    {{ vorstellung?.filmname }}
    <br>
    {{ createPlaetzeString() }}
    <br>
    <br>
    {{ angebot.platzDtos.length }} Plätze
    <br>
    {{ angebot.gesamtpreis.betragInEuroCent | geldbetrag }}
  </div>
  <img class="qr-code" src="assets/qr-code.png" alt="https://www.wps.de"/>
</div>
