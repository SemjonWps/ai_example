<app-navbar title="Kartenverkauf"/>

<app-vorstellung
  [vorstellung]="vorstellung"
/>
<app-platzanzahl
  (onPlatzanzahlButtonClick)="forderePlaetzeAn($event)"
/>
<app-saalplan
  [saalplanDto]="angebot?.saalplan"
  [angebotenePlaetze]="angebot?.plaetze"
  *ngIf="zeigeSaalplanKomponente"
/>
<app-zahlung
  [gesamtpreis]="angebot!.gesamtpreis"
  *ngIf="zeigeZahlungKomponente"
  (oeffneZahlungDialog)="oeffneZahlungDialog()"
/>
<app-zahlungdialog
  [angebot]="angebot"
  [vorstellung]="vorstellung"
  *ngIf="zeigeZahlungDialogKomponente"
  (schliesse)="schliesseZahlungDialog()"
/>
<app-kinokarte
  [angebot]="angebot!"
  [vorstellung]="vorstellung"
  *ngIf="zeigeKinokarteKomponente"
/>
