<div class="button-group" role="radiogroup" aria-label="Wochentage">
  <button *ngFor="let datum of selectableDates"
          (click)="selectDate(datum)"
          [ngClass]="{'active': !isBeforeToday(datum) , 'selected': selectedDate === datum}"
          [disabled]="isBeforeToday(datum)"
          role="radio"
          class="date-item"
          [attr.aria-checked]="selectedDate.toDateString() === datum.toDateString()">
    {{ datum | date:'EE' }}<br/>{{ datum | date:'dd.MM.' }}
  </button>
</div>
